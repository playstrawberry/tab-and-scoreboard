[package]
name = "tab-and-scoreboard"
version = "0.3.0"
edition = "2024"
description = "Tab and Scoreboard: tab list, nametags and sidebar with perms-lite ranks, images and built-in placeholders."
authors = ["Strawberry Interactive LLC"]
license = "LicenseRef-Strawberry-Source-Available-1.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sp-ranks = { path = "libs/sp-ranks" }
strawberry-plugin-api = { version = "=0.2.3", registry = "strawberry" }

# A repository of its own, not a member of a larger workspace.
[workspace]
members = ["libs/sp-ranks"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
